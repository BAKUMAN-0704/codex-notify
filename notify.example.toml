# codex-notify 配置示例
#
# 用法：复制成 notify.toml 放在 exe 旁边，然后改下面三处：
#   1. chain    —— 如果你还需要原来的 notify 程序
#   2. access_token —— 和 NapCat 里配的保持一致
#   3. target   —— 改成你自己的 QQ 号
#
# 或者直接运行 `codex-notify --init` 生成一份，效果一样。

enabled = true
# 摘要最多保留多少个字符（按字数算，一个汉字算 1）
max_chars = 260
# 单次 HTTP 超时（秒）。这个值直接决定回合结束后最多卡多久
timeout_secs = 5
# 消息标题前缀
prefix = "[Codex]"
# 消息里是否带上 5h / 周额度（从 ~/.codex 的会话日志里读，只读不写）
show_limits = true
# 末尾是否带 (turn N · thread XXXXXXXX) 会话标记
show_footer = false

# 链式转发：Codex 的 notify 槽位只有一个。
#
# 有两种情况，先看你 ~/.codex/config.toml 里 notify 那行长什么样：
#
#   A) 里面出现 --previous-notify
#      说明 Codex 桌面版已经把桌宠包在前面、通过它转发到本程序。
#      此时这里必须留空，否则桌宠每回合会被调用两次。
#
#   B) 里面直接就是本程序的路径，且原本有别的程序
#      把原命令按数组写在这里，我们会先转发给它再发通知：
#      chain = ['C:\Users\you\...\codex-computer-use.exe', 'turn-ended']
#
chain = []

[qq]
# NapCat / LLOneBot 的 HTTP 服务地址（WebUI 里「网络配置 -> HTTP 服务器」）
base_url = "http://127.0.0.1:3000"
# OneBot 的 access_token。NapCat 里设了就要填一致的，没设就留空。
# 注意：这个接口能以你的 QQ 身份发消息，建议至少设一个 token。
access_token = ""
# 发给自己：private:你的QQ号
# 发到群：  group:群号
target = "private:123456789"

# 托管 NapCat（可选，仅托盘模式生效）
#
# 配了之后：
#   - 托盘启动时，如果 NapCat 没在跑（端口连不上），就一并拉起它
#   - 托盘退出时，把「由本程序启动的」NapCat 一起结束
#   - 你手动开的 NapCat 不在管控范围：它不接管，也不会去杀
#
# 留空 command 就等于不托管。
[napcat]
# Windows 版 NapCat 的启动脚本。launcher-user.bat 不提权；
# 如果你的 QQ 装在 Program Files 且注入失败，换成会弹 UAC 的 launcher.bat
# command = ['D:\tools\NapCat\launcher-user.bat']
command = []
# 退出托盘时是否结束 NapCat（只针对上面这条命令启动的那个）
kill_on_exit = true
