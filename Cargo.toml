[package]
name = "codex-notify"
version = "0.1.0"
edition = "2021"
description = "Codex 的 notify 钩子：回合结束时把结果推到 QQ"

[dependencies]
# 解析 Codex 递进来的事件 JSON，以及序列化发给 OneBot 的请求体
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 解析 notify.toml
toml = "0.8"
# 极简的阻塞式 HTTP 客户端。
# 关掉默认特性：本程序只访问本机 NapCat 的 http 接口，用不到 TLS，
# 这样能省掉 rustls/ring 这一大坨依赖，编译更快、二进制更小。
ureq = { version = "2", default-features = false }

[profile.release]
opt-level = "z"      # 优先体积，这个程序不做计算密集的事
lto = true           # 跨 crate 内联，进一步压缩体积
strip = true         # 去掉符号表
codegen-units = 1    # 配合 lto 做更彻底的优化
panic = "abort"      # 不需要展开栈，出错直接退出即可
