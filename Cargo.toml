[package]
name = "codex-notify"
version = "0.3.0"
edition = "2021"
description = "Codex 的 notify 钩子：回合结束时把结果推到 QQ"

[dependencies]
# 解析 Codex 递进来的事件 JSON，以及序列化发给 OneBot 的请求体
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 解析 notify.toml
toml = "0.8"
# 极简的阻塞式 HTTP 客户端。
# 关掉默认特性：本程序只访问本机 NapCat 的 http 接口，用不到 TLS，
# 这样能省掉 rustls/ring 这一大坨依赖，编译更快、二进制更小。
ureq = { version = "2", default-features = false }

# Windows 专属：托盘图标、控制台附着。
# 用 windows-sys 而不是 windows crate —— 前者只提供 FFI 声明，不带封装层，
# 编译更快、体积更小，正好适合我们这种只需要几个 API 的场景。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",      # WNDCLASSW 里的 hbrBackground 需要 HBRUSH
    "Win32_System_Console",
    "Win32_System_JobObjects", # 托管 NapCat：进程关闭时连带结束整棵进程树
    "Win32_Security",          # CreateJobObjectW 的参数类型 SECURITY_ATTRIBUTES
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",  # OpenProcess
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
# 把 assets/codex-notify.ico 编译进 exe 的 Windows 资源段，
# 这样任务栏、资源管理器里显示的是自己的图标而不是默认空白图标
winres = "0.1"

[profile.release]
opt-level = "z"      # 优先体积，这个程序不做计算密集的事
lto = true           # 跨 crate 内联，进一步压缩体积
strip = true         # 去掉符号表
codegen-units = 1    # 配合 lto 做更彻底的优化
panic = "abort"      # 不需要展开栈，出错直接退出即可
